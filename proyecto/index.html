<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega de Tarea</title>
  <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
    
        body {
          font-family: Arial, sans-serif;
          background-color: #121212;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100%;
          padding: 20px;
        }
    
        .container {
          background: white;
          padding: 25px;
          height:100%;
          border-radius: 15px;
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
          width: 100%;
          max-width: 600px;
          transition: transform 0.3s ease-in-out;
        }
    
        h1 {
          text-align: center;
          color: #333;
          margin-bottom: 20px;
        }
    
        label {
          font-weight: bold;
          display: block;
          margin: 10px 0 5px;
        }
    
        input, select, textarea {
          width: 100%;
          padding: 10px;
          margin-bottom: 10px;
          border: 2px solid #ccc;
          border-radius: 5px;
          transition: all 0.3s ease;
          font-size: 16px;
        }
    
        input:focus, select:focus, textarea:focus {
          border-color: #4CAF50;
          box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
          outline: none;
        }
    
        .estado-container {
          display: flex;
          align-items: center;
        }
    
        .estado-container span {
          margin-left: 10px;
          font-weight: bold;
          color: #333;
        }
    
        .checkbox-group {
          display: flex;
          flex-wrap: wrap;
        }
    
        .checkbox-group label {
          margin-right: 10px;
          font-weight: normal;
        }
    
        .buttons {
          display: flex;
          justify-content: space-between;
          margin-top: 15px;
        }
    
        .btn {
          padding: 12px;
          border: none;
          cursor: pointer;
          font-size: 16px;
          border-radius: 5px;
          transition: all 0.3s ease-in-out;
        }
    
        .btn-send {
          background: #4CAF50;
          color: white;
          box-shadow: 0 0 8px rgba(76, 175, 80, 0.4);
        }
    
        .btn-send:hover {
          background: #45a049;
          box-shadow: 0 0 15px rgba(76, 175, 80, 0.7);
          transform: scale(1.05);
        }
    
        .btn-reset {
          background: #f44336;
          color: white;
          box-shadow: 0 0 8px rgba(244, 67, 54, 0.4);
        }
    
        .btn-reset:hover {
          background: #d32f2f;
          box-shadow: 0 0 15px rgba(244, 67, 54, 0.7);
          transform: scale(1.05);
        }
    
        @media (max-width: 600px) {
          .container {
            width: 90%;
          }
          .buttons {
            flex-direction: column;
          }
          .btn {
            width: 100%;
            margin-bottom: 10px;
          }
        }
  </style>
</head>
<body>

  <div class="container">
    <h1>Entrega de Tarea</h1>
    <form id="taskForm" action="formulario_entrega.php" method="POST" enctype="multipart/form-data">
      <label for="usuario">Nombre de Usuario:</label>
      <input type="text" id="usuario" name="usuario" required>

      <label for="cargo">Cargo:</label>
      <select id="cargo" name="cargo" required>
        <option value="Desarrollador">Desarrollador</option>
        <option value="Grafista">Grafista</option>
        <option value="QA">QA</option>
        <option value="Jefe de equipo">Jefe de equipo</option>
        <option value="IT">IT</option>
      </select>

      <label for="estado">Estado de la tarea:</label>
      <div class="estado-container">
        <input type="range" id="estado" name="estado" min="0" max="100" step="1" value="0" required>
        <span id="estadoValor">0%</span>
      </div>

      <label for="fechaInicio">Fecha de Inicio:</label>
      <input type="date" id="fechaInicio" name="fechaInicio" required>

      <label for="fechaFin">Fecha de Terminación:</label>
      <input type="date" id="fechaFin" name="fechaFin" required>

      <label>¿Está dentro del tiempo?</label>
      <input type="radio" id="dentroTiempoSi" name="dentroTiempo" value="Sí" required> Sí
      <input type="radio" id="dentroTiempoNo" name="dentroTiempo" value="No" required> No

      <label for="tipoTarea">Tipo de Tarea:</label>
      <div class="checkbox-group">
        <input type="checkbox" id="codigo" name="tipoTarea[]" value="Código"><label for="codigo">Código</label>
        <input type="checkbox" id="grafismo" name="tipoTarea[]" value="Grafismo"><label for="grafismo">Grafismo</label>
        <input type="checkbox" id="test" name="tipoTarea[]" value="Test"><label for="test">Test</label>
        <input type="checkbox" id="bug" name="tipoTarea[]" value="Bug"><label for="bug">Bug</label>
        <input type="checkbox" id="documentacion" name="tipoTarea[]" value="Documentación"><label for="documentacion">Documentación</label>
      </div>

      <label for="tareaPadre">Tarea Padre:</label>
      <select id="tareaPadre" name="tareaPadre" required>
        <option value="Tarea A">Tarea A</option>
        <option value="Tarea B">Tarea B</option>
        <option value="Tarea C">Tarea C</option>
        <option value="Tarea D">Tarea D</option>
        <option value="Tarea E">Tarea E</option>
        <option value="Ninguna">Ninguna</option>
      </select>

      <label for="descripcion">Descripción del estado actual:</label>
      <textarea id="descripcion" name="descripcion" rows="4"></textarea>

      <div class="buttons">
        <button type="submit" class="btn btn-send">✉️ Enviar</button>
        <button type="reset" class="btn btn-reset">🗑️ Reset</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('estado').addEventListener('input', function() {
      document.getElementById('estadoValor').textContent = this.value + '%';
    });

    
  </script>

</body>
</html>
